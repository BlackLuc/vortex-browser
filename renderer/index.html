<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self' https: wss:;
      frame-src https: http: about:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    "
  >

  <title>Vortex Browser</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
  <script src="renderer.js" defer></script>
</head>

<body>
  <div id="app">
    <header>
      <div id="tabs-bar">
        <span class="brand">◉ Vortex</span>

        <div id="tabs" role="tablist" aria-label="Browser tabs"></div>

        <button
          id="btn-newtab"
          class="icon-btn"
          title="New tab"
          aria-label="New tab"
        >+</button>

        <div id="workspace-tools">
          <select id="ws-select" aria-label="Workspace"></select>

          <button
            id="btn-ws-new"
            class="icon-btn"
            title="New workspace"
            aria-label="New workspace"
          >+</button>

          <button
            id="btn-split"
            class="icon-btn"
            title="Toggle split view"
            aria-label="Toggle split view"
            aria-pressed="false"
          >◫</button>
        </div>

        <span id="incognito-badge" class="hidden">Private</span>
      </div>

      <div id="toolbar">
        <button id="btn-back" class="icon-btn" title="Back" aria-label="Back">←</button>
        <button id="btn-forward" class="icon-btn" title="Forward" aria-label="Forward">→</button>
        <button id="btn-reload" class="icon-btn" title="Reload" aria-label="Reload">↻</button>
        <button id="btn-home" class="icon-btn" title="Home" aria-label="Home">⌂</button>

        <div id="address-wrap">
          <button
            id="btn-site"
            class="icon-btn"
            title="Website permissions"
            aria-label="Website permissions"
          >◈</button>

          <input
            id="address"
            type="text"
            placeholder="Search or enter URL"
            aria-label="Search or enter URL"
            autocomplete="off"
            spellcheck="false"
          >

          <span id="zoom-label" class="hidden"></span>

          <button
            id="btn-star"
            class="icon-btn"
            title="Bookmark this page"
            aria-label="Bookmark this page"
          >☆</button>

          <div id="suggestions" class="hidden"></div>
        </div>

        <button id="btn-find" class="icon-btn" title="Find in page" aria-label="Find in page">⌕</button>
        <button id="btn-bookmarks" class="icon-btn" title="Bookmarks" aria-label="Bookmarks">★</button>
        <button id="btn-history" class="icon-btn" title="History" aria-label="History">◷</button>
        <button id="btn-downloads" class="icon-btn" title="Downloads" aria-label="Downloads">↓</button>
        <button id="btn-commands" class="icon-btn" title="Command palette" aria-label="Command palette">⌘</button>
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
        <button id="btn-menu" class="icon-btn" title="Menu" aria-label="Menu">⋮</button>
      </div>

      <nav id="bookmarks-bar" aria-label="Bookmarks bar"></nav>
    </header>

    <main id="views-row">
      <div id="views"></div>

      <aside id="sidebar" class="hidden" aria-label="Browser panel">
        <div class="sidebar-header">
          <h2 id="sidebar-title">Panel</h2>
          <button
            id="sidebar-close"
            class="icon-btn"
            title="Close panel"
            aria-label="Close panel"
          >×</button>
        </div>

        <div id="panel-content"></div>
      </aside>
    </main>
  </div>

  <div id="findbar" class="hidden">
    <input
      id="find-input"
      type="text"
      placeholder="Find in page"
      aria-label="Find in page"
    >

    <span id="find-count" aria-live="polite"></span>

    <button id="find-prev" class="icon-btn" title="Previous match" aria-label="Previous match">↑</button>
    <button id="find-next" class="icon-btn" title="Next match" aria-label="Next match">↓</button>
    <button id="find-close" class="icon-btn" title="Close find" aria-label="Close find">×</button>
  </div>

  <dialog id="command-palette">
    <div class="dialog-heading">
      <h2>Commands</h2>
      <button
        class="icon-btn"
        data-close="command-palette"
        aria-label="Close command palette"
      >×</button>
    </div>

    <input
      id="cp-input"
      type="text"
      placeholder="Search commands, tabs, bookmarks or history"
      aria-label="Search commands"
      autocomplete="off"
    >

    <div id="cp-results"></div>
  </dialog>

  <dialog id="menu">
    <div class="dialog-heading">
      <h2>Vortex</h2>
      <button class="icon-btn" data-close="menu" aria-label="Close menu">×</button>
    </div>

    <div id="menu-items"></div>
  </dialog>

  <dialog id="tab-menu">
    <div class="dialog-heading">
      <h2>Tab options</h2>
      <button class="icon-btn" data-close="tab-menu" aria-label="Close tab options">×</button>
    </div>

    <div id="tab-menu-items"></div>
  </dialog>

  <dialog id="perm-prompt">
    <h2>Permission request</h2>

    <p>
      <strong id="perm-origin"></strong>
      wants to use
      <strong id="perm-type"></strong>.
    </p>

    <div class="dialog-actions">
      <button id="perm-deny" class="btn-danger">Deny</button>
      <button id="perm-allow" class="btn-primary">Allow</button>
    </div>
  </dialog>

  <div id="reader-toolbar" class="hidden">
    <button id="reader-play" class="icon-btn" title="Read aloud" aria-label="Read aloud">▶</button>
    <button id="reader-stop" class="icon-btn" title="Stop reading" aria-label="Stop reading">■</button>
    <button id="reader-exit" class="icon-btn" title="Exit reader mode" aria-label="Exit reader mode">×</button>
  </div>

  <div id="vx-toast" class="hidden" role="status"></div>
</body>
</html>
